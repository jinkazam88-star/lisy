<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lisy">
<title>Lisy na hale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <div class="hrow">
    <div class="brand">
      <span class="logo" data-ic="logo"></span>
      <div class="brand-t"><h1>Lisy na hale</h1><div class="src"><span id="srcInfo"></span><span id="ver" class="ver"></span></div></div>
    </div>
    <div class="clock"><b id="clock" class="mono">--:--</b><span><span id="shiftName"></span> · do <span id="shiftEnd" class="mono"></span></span></div>
  </div>
  <div class="stats" id="filters" role="group" aria-label="Filtr lisů">
    <button class="stat" data-f="all" aria-pressed="true"><b id="cAll">0</b><span>Vše</span></button>
    <button class="stat s-run" data-f="run" aria-pressed="false"><b id="cRun">0</b><span>Běží</span></button>
    <button class="stat s-warn" data-f="shift" aria-pressed="false"><b id="cShift">0</b><span>Končí směnu</span></button>
    <button class="stat s-idle" data-f="idle" aria-pressed="false"><b id="cIdle">0</b><span>Stojí</span></button>
  </div>
</header>

<main>
  <section id="v-hala"><div class="grid" id="grid"></div></section>

  <section id="v-predani" hidden>
    <h2>Předání směny</h2>
    <div class="who"><label for="who">Předává / přebírá</label><input type="text" id="who" placeholder="Tvoje jméno" autocomplete="name"></div>
    <div class="bigbtns">
      <button class="primary" id="btnGive" data-ic="qr">Předat směnu</button>
      <button class="secondary" id="btnTake" data-ic="scan">Načíst od předchozí směny</button>
    </div>
    <h2>Končí do konce příští směny</h2>
    <div class="list" id="handover"></div>
    <h2>Poslední změny</h2>
    <div class="list" id="log"></div>
  </section>

  <section id="v-katalog" hidden>
    <h2>Katalog výrobků <span class="cnt" id="catCount"></span></h2>
    <p class="hint">Výrobky, které jdou vybrat při zadávání k lisu.</p>
    <div class="bigbtns two">
      <button class="secondary" id="btnCatGive" data-ic="share">Sdílet katalog</button>
      <button class="secondary" id="btnCatTake" data-ic="scan">Načíst katalog</button>
    </div>
    <form class="cat-add" id="catForm">
      <input type="text" id="catNew" placeholder="Název výrobku" aria-label="Nový výrobek">
      <button class="primary" type="submit">Přidat</button>
    </form>
    <input type="search" id="catSearch" placeholder="Hledat v katalogu" aria-label="Hledat v katalogu">
    <div class="list" id="catalog"></div>
  </section>
</main>

<nav>
  <button data-v="hala" aria-current="page" data-ic="grid">Hala</button>
  <button data-v="predani" data-ic="swap">Předání</button>
  <button data-v="katalog" data-ic="list">Katalog</button>
</nav>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<dialog id="dlg2"><div class="sheet" id="sheet2"></div></dialog>
<datalist id="products"></datalist>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="qrcode.js"></script>
<script src="lz-string.min.js"></script>
<script src="jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
