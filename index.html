<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lisy">
<title>Lisy na hale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="hrow">
    <h1>Lisy na hale</h1>
    <div class="shift"><span id="shiftName"></span> · konec <b class="mono" id="shiftEnd"></b></div>
  </div>
  <div class="src"><span id="srcInfo"></span> <span id="ver" class="ver"></span></div>
  <div class="chips" id="filters" role="group" aria-label="Filtr lisů">
    <button class="chip" data-f="all" aria-pressed="true">Všechny</button>
    <button class="chip" data-f="shift" aria-pressed="false">Končí tuto směnu</button>
    <button class="chip" data-f="stop" aria-pressed="false">Zastavené</button>
    <button class="chip" data-f="idle" aria-pressed="false">Stojí</button>
  </div>
</header>

<main>
  <section id="v-hala"><div class="grid" id="grid"></div></section>

  <section id="v-predani" hidden>
    <h2>Předání směny</h2>
    <div class="who"><label for="who">Předává / přebírá</label><input type="text" id="who" placeholder="Tvoje jméno" autocomplete="name"></div>
    <div class="bigbtns">
      <button class="primary" id="btnGive">Předat směnu</button>
      <button class="secondary" id="btnTake">Načíst od předchozí směny</button>
    </div>
    <h2>Končí do konce příští směny</h2>
    <div class="list" id="handover"></div>
    <h2>Poslední změny</h2>
    <div class="list" id="log"></div>
  </section>

  <section id="v-katalog" hidden>
    <h2>Katalog výrobků <span class="cnt" id="catCount"></span></h2>
    <p class="hint">Výrobky, které jdou vybrat při zadávání k lisu.</p>
    <div class="bigbtns two">
      <button class="secondary" id="btnCatGive">Sdílet katalog</button>
      <button class="secondary" id="btnCatTake">Načíst katalog</button>
    </div>
    <form class="cat-add" id="catForm">
      <input type="text" id="catNew" placeholder="Název výrobku" aria-label="Nový výrobek">
      <button class="primary" type="submit">Přidat</button>
    </form>
    <input type="search" id="catSearch" placeholder="Hledat v katalogu" aria-label="Hledat v katalogu">
    <div class="list" id="catalog"></div>
  </section>
</main>

<nav>
  <button data-v="hala" aria-current="page">Hala</button>
  <button data-v="predani">Předání</button>
  <button data-v="katalog">Katalog</button>
</nav>

<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<dialog id="dlg2"><div class="sheet" id="sheet2"></div></dialog>
<datalist id="products"></datalist>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script src="qrcode.js"></script>
<script src="lz-string.min.js"></script>
<script src="jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
